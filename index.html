    property="og:title"

    content="Automated Excel systems and business workflow automation for businesses across India. By Krish Borade, Founder of Altorz."

  <!-- Page Title -->
  <title>Altorz — Automated Excel Systems for Businesses</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts: Fraunces (display), Inter Tight (body), JetBrains Mono (mono) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="/assets/images/altorz-favicon.png"
  >
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/assets/images/altorz-favicon.png"
  >
  <link
    rel="apple-touch-icon"
    href="/assets/images/altorz-favicon.png"
  >
</head>

<body>

  <!-- ============ NAVIGATION ============ -->
  <nav class="nav" id="nav"></nav>

  <!-- ============ HERO ============ -->
  <header class="hero" id="home">
    <div id="hero"></div>
  </header>

  <!-- ============ TRUST STRIP ============ -->
  <section class="trust-strip" id="trustStrip"></section>

  <!-- ============ ABOUT ============ -->
  <section class="section" id="about"></section>

  <!-- ============ CAPABILITIES ============ -->
  <section class="section" id="services" style="background: var(--bg-2);"></section>

  <!-- ============ PORTFOLIO ============ -->
  <section class="section" id="work"></section>

  <!-- ============ FEATURED CASE STUDIES ============ -->
  <section class="section" id="featured" style="background: var(--bg-2);"></section>

  <!-- ============ ETL LIVE DEMO ============ -->
  <section class="section etl-section" id="etlDemo"></section>

  <!-- ============ SKILLS ============ -->
  <section class="section" id="skills"></section>

  <!-- ============ PROCESS ============ -->
  <section class="section" id="process" style="background: var(--bg-2);"></section>

  <!-- ============ WHY ME ============ -->
  <section class="section" id="whyMe"></section>

  <!-- ============ TESTIMONIALS ============ -->
  <section class="section" id="testimonials" style="background: var(--bg-2);"></section>

  <!-- ============ PRICING ============ -->
  <section class="section" id="pricing"></section>

  <!-- ============ FAQ ============ -->
  <section class="section" id="faq" style="background: var(--bg-2);"></section>

  <!-- ============ CONTACT ============ -->
  <section class="section contact-section" id="contact"></section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer" id="footer"></footer>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- ============ APP ============ -->
  <script src="js/main.js"></script>

<!-- Hidden form for Netlify Forms detection at build time.
     The visible form is rendered dynamically by js/main.js and submits to this. -->
<form name="project-inquiry" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="company" />
  <input type="text" name="budget" />
  <input type="text" name="service" />
  <textarea name="message"></textarea>
</form>
</body>
